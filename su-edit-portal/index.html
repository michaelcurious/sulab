<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Su Lab Editor</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ink: #141816;
        --muted: #5a625f;
        --paper: #f7f5ef;
        --panel: #fffdf8;
        --teal: #0a4244;
        --line: rgba(20, 24, 22, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background: var(--paper);
      }

      .gate {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(rgba(247, 245, 239, 0.88), rgba(247, 245, 239, 0.94)),
          url("../assets/hero-cell-fate.png") center / cover;
      }

      .gate.hidden,
      .editor.hidden {
        display: none;
      }

      .panel {
        width: min(460px, 100%);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 22px 60px rgba(18, 24, 22, 0.16);
      }

      h1,
      h2 {
        margin: 0 0 8px;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
      }

      label {
        display: grid;
        gap: 8px;
        color: #2c3430;
        font-weight: 760;
      }

      input,
      textarea {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      button,
      .button {
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        color: #fffdf8;
        background: var(--teal);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      .gate button {
        width: 100%;
        margin-top: 16px;
      }

      .error {
        min-height: 20px;
        margin-top: 12px;
        color: #9a3d43;
        font-weight: 760;
      }

      .editor {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      .editor-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .actions button,
      .actions .button {
        padding: 0 18px;
        display: inline-grid;
        place-items: center;
        text-decoration: none;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .card.full {
        grid-column: 1 / -1;
      }

      .field-stack {
        display: grid;
        gap: 12px;
      }

      .news-row {
        display: grid;
        grid-template-columns: 140px 140px 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }

      .status {
        min-height: 22px;
        margin-top: 14px;
        color: var(--muted);
        font-weight: 720;
      }

      @media (max-width: 760px) {
        .grid,
        .news-row,
        .editor-header {
          grid-template-columns: 1fr;
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <form class="gate" id="admin-gate">
      <div class="panel">
        <h1>Su Lab Editor</h1>
        <p>Enter the editor code to update site content. No GitHub login.</p>
        <label>
          Editor code
          <input id="admin-code" type="password" autocomplete="current-password" autofocus />
        </label>
        <button type="submit">Open editor</button>
        <div class="error" id="gate-error" role="status"></div>
      </div>
    </form>

    <main class="editor hidden" id="editor">
      <header class="editor-header">
        <div>
          <h1>Su Lab Editor</h1>
          <p>Edit the site text, news, contact email, and publications.</p>
        </div>
        <div class="actions">
          <a class="button" href="/" target="_blank" rel="noreferrer">View site</a>
          <button type="button" id="save-button">Save changes</button>
        </div>
      </header>

      <form class="grid" id="content-form">
        <section class="card">
          <h2>Hero</h2>
          <div class="field-stack">
            <label>
              Title
              <input id="hero-title" />
            </label>
            <label>
              Short description
              <textarea id="hero-copy"></textarea>
            </label>
          </div>
        </section>

        <section class="card">
          <h2>Research</h2>
          <div class="field-stack">
            <label>
              Title
              <input id="research-title" />
            </label>
            <label>
              Summary
              <textarea id="research-copy"></textarea>
            </label>
          </div>
        </section>

        <section class="card">
          <h2>Updates</h2>
          <div class="field-stack">
            <label>
              Title
              <input id="updates-title" />
            </label>
            <label>
              Summary
              <textarea id="updates-copy"></textarea>
            </label>
          </div>
        </section>

        <section class="card">
          <h2>Contact</h2>
          <label>
            Email
            <input id="contact-email" type="email" />
          </label>
        </section>

        <section class="card full">
          <h2>News</h2>
          <div id="news-list"></div>
          <button type="button" id="add-news">Add news item</button>
        </section>

        <section class="card full">
          <h2>Publications</h2>
          <p>Keep one blank line between publications. PMIDs will still link automatically.</p>
          <textarea id="publications" style="min-height: 360px"></textarea>
        </section>
      </form>

      <div class="status" id="status" role="status"></div>
    </main>

    <script>
      const gate = document.querySelector("#admin-gate");
      const input = document.querySelector("#admin-code");
      const error = document.querySelector("#gate-error");
      const editor = document.querySelector("#editor");
      const status = document.querySelector("#status");
      const newsList = document.querySelector("#news-list");
      const saveButton = document.querySelector("#save-button");
      const addNewsButton = document.querySelector("#add-news");
      let adminCode = "";
      let content = null;

      function setValue(id, value) {
        document.querySelector(`#${id}`).value = value || "";
      }

      function getValue(id) {
        return document.querySelector(`#${id}`).value.trim();
      }

      function renderNews(news) {
        newsList.innerHTML = "";
        news.forEach((item, index) => {
          const row = document.createElement("div");
          row.className = "news-row";
          row.innerHTML = `
            <input aria-label="News date ${index + 1}" type="date" value="${item.date || ""}" />
            <input aria-label="News label ${index + 1}" placeholder="Jan 1, 2026" value="${item.label || ""}" />
            <input aria-label="News text ${index + 1}" placeholder="News text" value="${item.text || ""}" />
          `;
          newsList.append(row);
        });
      }

      function fillForm(data) {
        content = data;
        setValue("hero-title", data.hero?.title);
        setValue("hero-copy", data.hero?.copy);
        setValue("research-title", data.research?.title);
        setValue("research-copy", data.research?.copy);
        setValue("updates-title", data.updates?.title);
        setValue("updates-copy", data.updates?.copy);
        setValue("contact-email", data.contact?.email);
        setValue("publications", data.publications);
        renderNews(data.news || []);
      }

      function readForm() {
        const news = [...newsList.querySelectorAll(".news-row")]
          .map((row) => {
            const [date, label, text] = [...row.querySelectorAll("input")].map((field) =>
              field.value.trim(),
            );
            return { date, label, text };
          })
          .filter((item) => item.text);

        return {
          ...content,
          hero: {
            ...(content.hero || {}),
            title: getValue("hero-title"),
            copy: getValue("hero-copy"),
          },
          research: {
            ...(content.research || {}),
            title: getValue("research-title"),
            copy: getValue("research-copy"),
          },
          updates: {
            ...(content.updates || {}),
            title: getValue("updates-title"),
            copy: getValue("updates-copy"),
          },
          contact: {
            ...(content.contact || {}),
            email: getValue("contact-email"),
          },
          news,
          publications: getValue("publications"),
        };
      }

      async function loadContent() {
        status.textContent = "Loading content...";
        const response = await fetch("/api/content", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("Could not load content.");
        }
        fillForm(await response.json());
        status.textContent = "";
      }

      async function saveContent() {
        status.textContent = "Saving...";
        saveButton.disabled = true;

        try {
          const response = await fetch("/api/content", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-admin-code": adminCode,
            },
            body: JSON.stringify(readForm()),
          });
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.error || "Could not save changes.");
          }

          status.textContent = "Saved. Refresh the public site to see changes.";
        } catch (saveError) {
          status.textContent = saveError.message;
        } finally {
          saveButton.disabled = false;
        }
      }

      function openEditor(code) {
        adminCode = code;
        gate.classList.add("hidden");
        editor.classList.remove("hidden");
        loadContent().catch((loadError) => {
          status.textContent = loadError.message;
        });
      }

      gate.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!input.value.trim()) {
          error.textContent = "Enter the editor code.";
          return;
        }

        sessionStorage.setItem("su-lab-editor-code", input.value.trim());
        openEditor(input.value.trim());
      });

      addNewsButton.addEventListener("click", () => {
        const data = readForm();
        data.news.push({ date: "", label: "", text: "" });
        fillForm(data);
      });

      saveButton.addEventListener("click", saveContent);

      const savedCode = sessionStorage.getItem("su-lab-editor-code");
      if (savedCode) {
        openEditor(savedCode);
      }
    </script>
  </body>
</html>
