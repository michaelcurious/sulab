<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Su Lab</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #141816;
        background:
          linear-gradient(rgba(247, 245, 239, 0.88), rgba(247, 245, 239, 0.94)),
          url("../assets/hero-cell-fate.png") center / cover;
      }

      .gate {
        width: min(420px, calc(100% - 32px));
        padding: 28px;
        border: 1px solid rgba(20, 24, 22, 0.12);
        border-radius: 8px;
        background: #fffdf8;
        box-shadow: 0 22px 60px rgba(18, 24, 22, 0.16);
      }

      .gate.hidden {
        display: none;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.7rem;
      }

      p {
        margin: 0 0 18px;
        color: #5a625f;
      }

      label {
        display: grid;
        gap: 8px;
        color: #2c3430;
        font-weight: 760;
      }

      input {
        min-height: 46px;
        padding: 0 12px;
        border: 1px solid rgba(20, 24, 22, 0.18);
        border-radius: 8px;
        font: inherit;
      }

      button {
        width: 100%;
        min-height: 46px;
        margin-top: 16px;
        border: 0;
        border-radius: 999px;
        color: #fffdf8;
        background: #0a4244;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      .error {
        min-height: 20px;
        margin-top: 12px;
        color: #9a3d43;
        font-weight: 760;
      }
    </style>
  </head>
  <body>
    <form class="gate" id="admin-gate">
      <h1>Su Lab</h1>
      <p>This page is not part of the public site.</p>
      <button type="button" onclick="window.location.href='../'">Return home</button>
    </form>
  </body>
</html>
